apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-service
  namespace: flight-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flight-service
  template:
    metadata:
      labels:
        app: flight-service
    spec:
      containers:
        - name: flight-service
          image: YOUR_DOCKERHUB_USERNAME/flight-flight-service:latest
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: flight-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flight-service-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
